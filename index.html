<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Destinations Francophones - L'Amour en Voyage</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* --- DESIGN SYSTEM --- */
        :root {
            --primary: #6c5ce7;
            --accent: #a29bfe;
            --text-main: #2d3436;
            --text-highlight: #d63031;
            --hero-color-start: #e67e22;
            --hero-color-end: #f39c12;
            --info-bg: rgba(255, 255, 255, 0.65);
            --vocab-highlight: #c349db; 
        }

        .highlight-word { font-weight: 800; color: var(--vocab-highlight) !important; }
        .thai-word { color: #636e72; font-size: 0.85em; margin-left: 4px; font-family: 'Tahoma', sans-serif; font-weight: normal; }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background: #000;
            font-family: 'Nunito', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ORIENTATION LOCK --- */
        #orientation-lock {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #2d3436;
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        #orientation-lock span {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: rotate-icon 2s infinite ease-in-out;
        }

        @keyframes rotate-icon {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (orientation: portrait) {
            #orientation-lock { display: flex; }
            #game-stage { display: none !important; }
        }

        #game-stage {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #2d3436;
            overflow: hidden;
        }

        /* --- BACKGROUND --- */
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; transition: background-image 0.5s ease-in-out; z-index: 1; }
        .bg-animate { animation: zoomSlow 20s infinite alternate; }
        @keyframes zoomSlow { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* --- LAYOUT GRID --- */
        .layout-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }

        /* ZONE HAUTE (70%) */
        .top-section {
            flex: 7; 
            display: flex;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .col-left {
            flex: 0 0 20%; 
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        .col-center {
            flex: 0 0 50%; 
            display: flex;
            justify-content: center; 
            align-items: flex-end; 
            position: relative;
            padding-bottom: 12vh; 
        }

        .col-right {
            flex: 0 0 30%; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            gap: 15px;
            padding-right: 20px;
        }

        /* ZONE BASSE (30%) */
        .bottom-section {
            flex: 3;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
            pointer-events: auto;
        }

        /* --- COMPONENTS --- */
        .control-btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            width: 50px; height: 50px;
            border-radius: 50%;
            display: none;
            justify-content: center; align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .control-btn:hover { background: rgba(255, 255, 255, 0.5); transform: scale(1.1); }

        /* Container Personnages */
        .char-container {
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            gap: 40px; 
            width: 100%;
            height: 100%;
        }

        .char-sprite, .dish-sprite {
            height: auto;
            max-height: 85%; 
            max-width: 32%; 
            object-fit: contain;
            border-radius: 20px;
            border: 3px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.4s ease;
            transform-origin: bottom center;
        }

        .char-sprite.active, .dish-sprite.active { opacity: 1; transform: translateY(0); }
        
        .char-sprite.speaking, .dish-sprite.active { 
            transform: scale(1.08) translateY(-5px); 
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--accent);
            z-index: 10;
        }

        /* Infos */
        .info-wrapper { width: 90%; max-width: 280px; display: flex; flex-direction: column; gap: 12px; }

        .location-box {
            background: var(--info-bg);
            padding: 12px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 2px solid white;
        }

        .vocab-box {
            background: var(--info-bg); 
            padding: 12px;
            border-radius: 15px;
            color: var(--text-main);
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            min-height: 220px; 
            overflow: hidden;
        }

        .vocab-title {
            font-family: 'Pacifico', cursive;
            color: var(--primary);
            margin-bottom: 8px;
            text-align: center;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
            flex-shrink: 0;
        }

        .vocab-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .vocab-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 3px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
        }
        .vocab-item.new { animation: slideIn 0.4s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        .vocab-item:last-child { border-bottom: none; }
        .vocab-word { font-weight: 700; color: #c349db; flex: 1; text-align: left; line-height: 1.1; word-wrap: break-word; }
        .vocab-thai { color: var(--text-main); font-family: 'Tahoma', sans-serif; font-size: 0.85rem; text-align: right; max-width: 45%; }


        /* Dialogue */
        .dialogue-box {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.85);
            width: 90%;
            max-width: 900px;
            height: 100%; 
            border-radius: 20px;
            box-shadow: 0 -5px 30px rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(15px);
        }

        .name-badge {
            position: absolute; top: -18px; left: 25px; 
            background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; 
            padding: 6px 20px; border-radius: 20px; 
            font-weight: 700; font-size: 1rem; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.2); 
            z-index: 20; text-transform: uppercase; letter-spacing: 1px; 
            transition: all 0.3s ease;
        }
        .name-badge.right-aligned { left: auto; right: 25px; }

        .text-content {
            padding: 30px 30px 15px 30px;
            font-size: clamp(1.3rem, 2.8vh, 1.7rem);
            line-height: 1.4;
            color: var(--text-main);
            height: 100%;
            overflow-y: auto;
        }
        
        .next-btn { 
            position: absolute; bottom: 15px; right: 20px; 
            width: 40px; height: 40px; 
            background: var(--primary); border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            color: white; cursor: pointer; animation: pulse 1.5s infinite; 
        }

        /* Choice Overlay */
        .choice-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(45, 52, 54, 0.95);
            z-index: 200;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            padding: 20px;
        }

        .name-input { padding: 15px; font-size: 1.3rem; border-radius: 50px; border: none; width: 80%; max-width: 400px; text-align: center; margin-bottom: 20px; }
        .choice-btn { background: white; border: none; padding: 12px 25px; width: 100%; max-width: 500px; border-radius: 50px; font-family: 'Nunito', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--text-main); cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 0 #dfe6e9; }
        .choice-btn:active { transform: translateY(4px); box-shadow: none; }
        .choice-btn:hover { background: var(--accent); color: white; }

        .cards-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; overflow-y: auto; max-height: 80vh; }
        
        /* MODIFICATION : Taille légèrement réduite pour les cartes */
        .img-card { background: white; padding: 8px; border-radius: 15px; cursor: pointer; width: 200px; text-align: center; transition: transform 0.2s; }
        .img-card:hover { transform: translateY(-5px); }
        .img-card img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .animate-text { animation: fadeInUp 0.3s ease-out forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .col-left { flex: 0 0 10%; padding-top: 10px; }
            .col-center { flex: 0 0 50%; align-items: flex-end; padding-bottom: 5px; }
            /* Le mémo ne disparaît plus sur petit écran, il s'adapte ! */
            .col-right { display: flex; flex: 0 0 40%; padding-top: 10px; padding-right: 10px; gap: 5px; }
            .info-wrapper { max-width: 100%; gap: 5px; }
            .vocab-box { min-height: 160px; padding: 8px; }
            .vocab-title { font-size: 1rem; margin-bottom: 3px; }
            .vocab-item { padding: 1px 0; }
            .vocab-word, .vocab-thai { font-size: 0.75rem; }
            .location-box { font-size: 0.85rem; padding: 6px; }
            .dialogue-box { width: 98%; height: 98%; }
            .text-content { font-size: 1.1rem; padding: 20px; }
            .char-sprite, .dish-sprite { max-width: 45%; }
        }
    </style>
</head>
<body>

    <div id="orientation-lock">
        <span>🔄</span>
        <p>Veuillez tourner votre appareil en mode paysage.</p>

    <div id="game-stage">
        <div id="bg" class="bg-layer bg-animate"></div>

        <div class="layout-grid">
            
            <div class="top-section">
                <!-- GAUCHE -->
                <div class="col-left">
                    <button id="back-btn" class="control-btn" onclick="goBack()" title="Retour">↩</button>
                </div>

                <!-- CENTRE -->
                <div class="col-center">
                    <div id="chars" class="char-container">

                    </div>

            <div class="bottom-section">
                <div id="dialogue-panel" class="dialogue-box" onclick="nextStep()">

                    <div id="dialogue-text" class="text-content">Chargement de l'aventure...</div>
                    <div class="next-btn">➤</div>

        </div>

        <div id="choice-screen" class="choice-overlay"></div>
    </div>

            { id: 'a1_meet_5', bg: images.bg.hotel, speaker: 'Heart', text: "Alors, Séraphin, tu dois nous aider ! À ton avis, où est notre clé ?", chars: ['AA', 'Heart'], next: 'a1_minigame' },

            { id: 'a1_minigame', bg: images.bg.hotel, speaker: 'Choix du Joueur', text: "Où chercher la clé ?", chars: [], type: 'image', choices: [ { text: 'Restaurant "Le Gourmet"', img: images.bg.resto, next: 'a1_wrong' }, { text: 'Piscine "L\'Océan Bleu"', img: images.bg.pool, next: 'a1_right' }, { text: 'Gymnase "Force et Forme"', img: images.bg.gym, next: 'a1_wrong' } ] },
            { id: 'a1_wrong', bg: images.bg.hotel, speaker: 'AA', text: "Ah non, je ne pense pas... Je n'ai pas encore mangé aujourd'hui et je n'aime pas trop le sport en salle. Essayons encore !", chars: ['AA', 'Heart'], next: 'a1_minigame' },
            { id: 'a1_right', bg: images.bg.hotel, speaker: 'AA', text: "Mais oui ! La piscine (สระว่ายน้ำ) ! Je me souviens maintenant, j’ai posé la clé de la chambre sur le bord de la piscine.", chars: ['AA', 'Heart'], next: 'a1_found' },
            { id: 'a1_found', bg: images.bg.pool, speaker: 'Heart', text: "(Il court et revient) Regarde ! Elle était juste là, près du grand bassin. Merci infiniment, Séraphin. Tu es très observateur.", chars: ['AA', 'Heart'], location: "Paris - Piscine", next: 'a1_hero' },
            { id: 'a1_hero', bg: images.bg.pool, speaker: 'AA', text: "Tu es notre héros !", chars: ['AA', 'Heart'], next: 'a1_hero_2' },
            { id: 'a1_hero_2', bg: images.bg.pool, speaker: 'Heart', text: "C’est vrai, tu es très fort !", chars: ['AA', 'Heart'], next: 'a1_response' },
            { id: 'a1_response', bg: images.bg.pool, speaker: 'Séraphin', text: "...", chars: ['AA', 'Heart'], choices: [ { text: "Mais non, c’était facile !", next: 'a1_invite' }, { text: "Merci, merci !", next: 'a1_invite' } ] },
            { id: 'a1_invite', bg: images.bg.hotel, speaker: 'AA', text: "On ne peut pas te laisser seul dans le couloir.", chars: ['AA', 'Heart'], location: "Paris - Couloir", next: 'a1_invite_2' },
            { id: 'a1_invite_2', bg: images.bg.hotel, speaker: 'Heart', text: "Viens avec nous dans la chambre, on va te présenter au reste du groupe BUS. On est 12, mais on est gentils !", chars: ['AA', 'Heart'], next: 'a2_start' },

            // ACTE 2
            { id: 'a2_start', bg: images.bg.room, speaker: 'Narration', text: "Nous entrons dans une suite royale. C'est magnifique ! Il y a de grandes fenêtres avec vue sur la Tour Eiffel.", chars: ['Marckris', 'Jung', 'Thai'], location: "Paris - Suite Royale", next: 'a2_1' },
            { id: 'a2_1', bg: images.bg.room, speaker: 'Marckris', text: "Écoutez-moi ! La Guadeloupe, c'est l'aventure parfaite. On peut monter sur le volcan (ภูเขาไฟ) de la Soufrière. Imaginez la vue ! Et l'odeur (กลิ่น) des plantations (ไร่) de canne à sucre (อ้อย)... C'est la nature sauvage !", chars: ['Marckris', 'Jung', 'Thai'], vocab: [{fr: "Volcan", label: "Le volcan", th: "ภูเขาไฟ"}, {fr: "Canne à sucre", label: "La canne à sucre", th: "อ้อย"}, {fr: "Odeur", label: "L'odeur", th: "กลิ่น"}, {fr: "Plantation", label: "La plantation", th: "ไร่"}], next: 'a2_2' },
            { id: 'a2_2', bg: images.bg.room, speaker: 'Jung', text: "Marckris, il fait trop chaud là-bas. On va transpirer tout le temps. Moi, je préfère Saint-Pierre et Miquelon. C'est au nord, près du Canada. On peut voir des sapins (ต้นสน), de la neige (หิมะ), et peut-être des baleines (วาฬ). C'est romantique et calme.", chars: ['Marckris', 'Jung', 'Thai'], vocab: [{fr: "Neige", label: "La neige", th: "หิมะ"}, {fr: "Baleine", label: "La baleine", th: "วาฬ"}, {fr: "Sapin", label: "Le sapin", th: "ต้นสน"}], next: 'a2_3' },
            { id: 'a2_3', bg: images.bg.room, speaker: 'Thai', text: "Vous oubliez le plus important : le repos ! À Tahiti, il y a des cocotiers (ต้นมะพร้าว), des plages de sable blanc et des lagons (ทะเลสาบน้ำเค็ม) transparents. On peut nager avec des poissons tropicaux toute la journée.", chars: ['Marckris', 'Jung', 'Thai'], vocab: [{fr: "Cocotier", label: "Le cocotier", th: "ต้นมะพร้าว"}, {fr: "Lagon", label: "Le lagon", th: "ทะเลสาบน้ำเค็ม"}], next: 'a2_4' },
            { id: 'a2_4', bg: images.bg.room, speaker: 'Marckris', text: "En Guadeloupe aussi on peut nager ! Il y a la célèbre plage Sainte-Anne, on peut aussi y boire du rhum (เหล้ารัม).", chars: ['Marckris', 'Jung', 'Thai'], vocab: [{fr: "Rhum", label: "Le rhum", th: "เหล้ารัม"}], next: 'a2_5' },
            { id: 'a2_5', bg: images.bg.room, speaker: 'Jung', text: "A Saint-Pierre et Miquelon, il y a des animaux tels que des loups, des phoques (แมวน้ำ) et des dauphins (โลมา). je pense que ce sera génial !", chars: ['Marckris', 'Jung', 'Thai'], vocab: [{fr: "Phoque", label: "Le phoque", th: "แมวน้ำ"}, {fr: "Dauphin", label: "Le dauphin", th: "โลมา"}], next: 'a2_6' },
            { id: 'a2_6', bg: images.bg.room, speaker: 'Thai', text: "Et à Tahiti, il y a aussi des dauphins, mais aussi des crabes (ปู) et des perroquets (นกแก้ว) !", chars: ['Marckris', 'Jung', 'Thai'], vocab: [{fr: "Crabe", label: "Le crabe", th: "ปู"}, {fr: "Perroquet", label: "Le perroquet", th: "นกแก้ว"}], next: 'a2_7' },
            { id: 'a2_7', bg: images.bg.room, speaker: 'Jung', text: "Et des moustiques !", chars: ['Marckris', 'Jung', 'Thai'], next: 'a2_8' },
            { id: 'a2_8', bg: images.bg.room, speaker: 'Marckris', text: "(Il remarque Séraphin) Tiens ? Qui est ce jeune homme élégant avec AA et Heart ?", chars: ['Marckris', 'Jung', 'Thai'], next: 'a2_9' },
            { id: 'a2_9', bg: images.bg.room, speaker: 'Heart', text: "C'est Séraphin. Il nous a aidés à retrouver la clé de la chambre.", chars: ['Heart', 'Marckris'], next: 'a2_10' },
            { id: 'a2_10', bg: images.bg.room, speaker: 'AA', text: "Oui, il est très gentil !", chars: ['AA', 'Jung'], next: 'a2_11' },
            { id: 'a2_11', bg: images.bg.room, speaker: 'Jung', text: "Enchanté, Séraphin !", chars: ['Jung', 'Marckris'], next: 'a2_12' },
            { id: 'a2_12', bg: images.bg.room, speaker: 'Marckris', text: "Bienvenue, Séraphin ! Moi c'est Marckris. J'adore les oiseaux, surtout les perroquets colorés. Et toi, tu aimes la nature ? Quel est ton animal préféré ?", chars: ['Marckris'], next: 'a2_animal_choice' },
            { id: 'a2_animal_choice', bg: images.bg.room, speaker: 'Séraphin', text: "Quel est mon animal préféré ?", chars: ['Marckris', 'Jung', 'Thai'], choices: [ { text: "J'adore les animaux marins, comme les dauphins. ", affinity: { Thai: 1 }, next: 'a2_animal_react' }, { text: "Je préfère les animaux de la forêt, comme les renards. ", affinity: { Jung: 1 }, next: 'a2_animal_react' }, { text: "Moi, je préfère les animaux domestiques, comme les chats. ", affinity: { Marckris: 1 }, next: 'a2_animal_react' } ] },
            { id: 'a2_animal_react', bg: images.bg.room, speaker: 'Thai', text: "C'est un bon choix ! Moi, mon rêve, c'est de voir une tortue marine (เต่าทะเล) géante à Tahiti.", chars: ['Thai', 'Jung'], vocab: [{fr: "Tortue marine", label: "La tortue marine", th: "เต่าทะเล"}], next: 'a2_animal_react_2' },
            { id: 'a2_animal_react_2', bg: images.bg.room, speaker: 'Jung', text: "Et moi, je veux voir un harfang des neiges (นกเค้าแมวหิมะ) à Saint-Pierre. C'est un oiseau blanc magnifique.", chars: ['Jung', 'AA'], vocab: [{fr: "Harfang des neiges", label: "L'harfang des neiges", th: "นกเค้าแมวหิมะ"}], next: 'a2_paris_choice' },
            { id: 'a2_paris_choice', bg: images.bg.room, speaker: 'Séraphin', text: "...", chars: ['AA', 'Jung'], choices: [ { text: "On peut voir ces animaux à Paris.", next: 'a2_paris_1' }, { text: "Pour voir ces animaux, il faut aller voyager !", next: 'a2_paris_2' } ] },
            { id: 'a2_paris_1', bg: images.bg.room, speaker: 'AA', text: "Ah non, je ne pense pas... Je n’en ai jamais vu à Paris…", chars: ['AA', 'Jung'], next: 'a2_paris_1b' },
            { id: 'a2_paris_1b', bg: images.bg.room, speaker: 'Jung', text: "En effet ! Heureusement, on part en vacances demain !", chars: ['AA', 'Jung'], next: 'a2_toilet' },
            { id: 'a2_paris_2', bg: images.bg.room, speaker: 'AA', text: "C’est vrai, mais heureusement, on voyage bientôt.", chars: ['AA', 'Jung'], next: 'a2_paris_2b' },
            { id: 'a2_paris_2b', bg: images.bg.room, speaker: 'Jung', text: "Oui, demain !", chars: ['AA', 'Jung'], next: 'a2_toilet' },
            { id: 'a2_toilet', bg: images.bg.room, speaker: 'Séraphin', text: "Ah bon, vous voyagez demain ? C’est super ! Excusez-moi, où sont les toilettes ?", chars: [], next: 'a3_start' },

            // ACTE 3
            { id: 'a3_start', bg: images.bg.bath, speaker: 'Narration', text: "Après toutes ces émotions, j'ai besoin d’aller aux toilettes. On m'indique la salle de bains. J'ouvre la porte, mais... oula ! Il y a beaucoup de vapeur et des rires derrière le rideau de douche. Je vois trois hommes en train de se doucher.", chars: [], location: "Paris - Salle de Bain", vocab: [], next: 'a3_1' },
            { id: 'a3_1', bg: images.bg.bath, speaker: 'Peemwasu', text: "(Voix joyeuse) Je vous assure, les gars ! L'eau glacée, c'est le secret des stars. C'est excellent pour la circulation et ça donne une peau très douce.", chars: ['Peemwasu', 'Copper', 'Nex'], next: 'a3_2' },
            { id: 'a3_2', bg: images.bg.bath, speaker: 'Copper', text: "(En grelottant) Tu es fou, Peemwasu ! C'est une torture ! Moi, j'adore l'eau très chaude. Ça détend tous les muscles après une journée de voyage.", chars: ['Peemwasu', 'Copper', 'Nex'], next: 'a3_3' },
            { id: 'a3_3', bg: images.bg.bath, speaker: 'Nex', text: "Calmez-vous ! Pourquoi choisir ? Moi, je commence par le chaud pour me relaxer, et je finis par le froid pour me réveiller. C'est l'équilibre parfait.", chars: ['Peemwasu', 'Copper', 'Nex'], next: 'a3_4' },
            { id: 'a3_4', bg: images.bg.bath, speaker: 'Narration', text: "Nex tire brusquement le rideau pour attraper son peignoir (เสื้อคลุมอาบน้ำ). Il s'arrête net en me voyant.", chars: ['Nex'], vocab: [{fr: "Peignoir", label: "Le peignoir", th: "เสื้อคลุมอาบน้ำ"}], next: 'a3_5' },
            { id: 'a3_5', bg: images.bg.bath, speaker: 'Nex', text: "Oh ! Un nouveau visage dans la buée ! Salut ! Tu es qui ?", chars: ['Nex'], next: 'a3_6' },
            { id: 'a3_6', bg: images.bg.bath, speaker: 'Séraphin', text: "(Très embarrassé) Oh ! Je suis désolé ! Je cherchais juste le lavabo... Je reviendrai plus tard !", chars: [], next: 'a3_7' },
            { id: 'a3_7', bg: images.bg.bath, speaker: 'Peemwasu', text: "(Sortant la tête de la douche) Mais non, reste ! On a presque fini. On discute juste de nos rituels de beauté.", chars: ['Peemwasu', 'Nex'], next: 'a3_8' },
            { id: 'a3_8', bg: images.bg.bath, speaker: 'Nex', text: "Ne sois pas timide, Séraphin. La salle de bains est immense. Tu veux te joindre à nous pour finir la douche ? On a encore plein de savon (สบู่) !", chars: ['Peemwasu', 'Nex', 'Copper'], next: 'a3_9' },
            { id: 'a3_9', bg: images.bg.bath, speaker: 'Copper', text: "Faut pas être timide, on prend toujours la douche (ฝักบัว) ensemble !", chars: ['Peemwasu', 'Nex', 'Copper'], next: 'a3_choice' },
            { id: 'a3_choice', bg: images.bg.bath, speaker: 'Séraphin', text: "...", chars: ['Peemwasu', 'Nex', 'Copper'], choices: [ { text: "C'est gentil, mais je vais attendre que vous sortiez...", next: 'a3_refusal' }, { text: "D'accord, l'eau chaude me fera du bien après ce voyage.", affinity: { Nex: 1, Copper: 1 }, next: 'a3_accept_hot' }, { text: "Allez, d'accord ! Je veux essayer l'eau froide avec vous !", affinity: { Peemwasu: 1 }, next: 'a3_accept_cold' } ] },
            { id: 'a3_refusal', bg: images.bg.bath, speaker: 'Séraphin', text: "Je préfère vous laisser... Je vous retrouve au dîner !", chars: [], next: 'a4_start' },
            { id: 'a3_accept_hot', bg: images.bg.bath, speaker: 'Séraphin', text: "L'eau chaude, c'est tentant...", chars: ['Peemwasu', 'Nex', 'Copper'], next: 'a3_discussion' },
            { id: 'a3_accept_cold', bg: images.bg.bath, speaker: 'Séraphin', text: "Soyons fous, l'eau froide !", chars: ['Peemwasu', 'Nex', 'Copper'], next: 'a3_discussion' },
            { id: 'a3_discussion', bg: images.bg.bath, speaker: 'Nex', text: "Regarde, j'ai un gel douche bio à la verveine. Ça sent le jardin français. Tu veux essayer ?", chars: ['Nex', 'Copper'], next: 'a3_discussion_2' },
            { id: 'a3_discussion_2', bg: images.bg.bath, speaker: 'Copper', text: "Et moi j'ai une huile de massage à la noix de coco. C'est très hydratant.", chars: ['Copper', 'Peemwasu'], next: 'a3_discussion_3' },
            { id: 'a3_discussion_3', bg: images.bg.bath, speaker: 'Peemwasu', text: "Séraphin, tu prends soin de toi d'habitude ? Tu as une peau très claire.", chars: ['Peemwasu', 'Nex'], next: 'a3_discussion_4' },
            { id: 'a3_discussion_4', bg: images.bg.bath, speaker: 'Séraphin', text: "Oh, j'essaie... mais je n'ai pas autant de produits que vous !", chars: [], next: 'a3_discussion_5' },
            { id: 'a3_discussion_5', bg: images.bg.bath, speaker: 'Nex', text: "(En riant) On va t'apprendre tous nos secrets, ne t'inquiète pas.", chars: ['Nex'], next: 'a4_start' },
            
            // ACTE 4 & 5
            { id: 'a4_start', bg: images.bg.dinner, speaker: 'Narration', text: "C'est l'heure du dîner. Les 13 garçons s'asseyent autour d'une immense table décorée de fleurs. C'est un festin incroyable.", chars: [], location: "Paris - Salle à Manger", next: 'a4_intro' },
            { id: 'a4_intro', bg: images.bg.dinner, speaker: 'Alan', text: "Silence tout le monde ! Pour fêter l'arrivée de Séraphin, nous avons commandé des spécialités de toute la francophonie. Chaque membre va présenter son plat préféré. Séraphin, on veut ton avis honnête sur chaque assiette !", chars: ['Alan'], next: 'a4_1_pres' },
            { id: 'a4_1_pres', bg: images.bg.dinner, speaker: 'Alan', text: "Voici le Poulet Yassa. C'est une spécialité du Sénégal. Il y a beaucoup d'oignons caramélisés et du citron (มะนาว) vert. C'est acide et sucré à la fois.", chars: ['Alan'], vocab: [{fr: "Citron", label: "Le citron", th: "มะนาว"}], dish: 'yassa', next: 'a4_1_choice' },
            { id: 'a4_1_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Que penser du Poulet Yassa ?)", chars: ['Alan'], dish: 'yassa', choices: [ { text: "C'est délicieux, j'adore le citron !", affinity: { Alan: 1 }, next: 'a4_2_pres' }, { text: "C'est un peu trop spécial pour moi.", affinity: { Alan: 0 }, next: 'a4_2_pres' } ]},

            { id: 'a4_2_pres', bg: images.bg.dinner, speaker: 'AA', text: "Goûtez mes Accras de morue. Ce sont des petits beignets de poisson épicés des Antilles. On les mange souvent à l'apéritif.", chars: ['AA'], dish: 'accras', next: 'a4_2_choice' },
            { id: 'a4_2_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Les accras...)", chars: ['AA'], dish: 'accras', choices: [ { text: "J'adore les plats frits et épicés !", affinity: { AA: 1 }, next: 'a4_3_pres' }, { text: "C'est un peu trop gras à mon goût.", affinity: { AA: 0 }, next: 'a4_3_pres' } ]},

            { id: 'a4_3_pres', bg: images.bg.dinner, speaker: 'Khunpol', text: "Voici le Rougail Saucisse de l'Île de la Réunion. Il y a des saucisses, des tomates, des oignons et du gingembre. Attention, c'est pimenté !", chars: ['Khunpol'], dish: 'rougail', next: 'a4_3_choice' },
            { id: 'a4_3_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Ça a l'air fort !)", chars: ['Khunpol'], dish: 'rougail', choices: [ { text: "Le piment, c'est la vie !", affinity: { Khunpol: 1 }, next: 'a4_4_pres' }, { text: "Ouh là, j'ai besoin d'un verre d'eau !", affinity: { Khunpol: 0 }, next: 'a4_4_pres' } ]},

            { id: 'a4_4_pres', bg: images.bg.dinner, speaker: 'Heart', text: "Moi, je viens du froid ! Voici la Poutine du Québec. Des frites, du fromage en grains et une sauce brune bien chaude.", chars: ['Heart'], dish: 'poutine', next: 'a4_4_choice' },
            { id: 'a4_4_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(De la poutine ?)", chars: ['Heart'], dish: 'poutine', choices: [ { text: "C'est le plat parfait pour l'hiver !", affinity: { Heart: 1 }, next: 'a4_5_pres' }, { text: "C'est un peu lourd le soir, non ?", affinity: { Heart: 0 }, next: 'a4_5_pres' } ]},

            { id: 'a4_5_pres', bg: images.bg.dinner, speaker: 'Jinwook', text: "Voici le Ndolé du Cameroun. C'est un plat à base de feuilles amères, de noix de terre, de viande et parfois de crevettes.", chars: ['Jinwook'], dish: 'ndole', next: 'a4_5_choice' },
            { id: 'a4_5_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Du Ndolé...)", chars: ['Jinwook'], dish: 'ndole', choices: [ { text: "C'est une découverte incroyable !", affinity: { Jinwook: 1 }, next: 'a4_6_pres' }, { text: "L'amertume, c'est un peu difficile.", affinity: { Jinwook: 0 }, next: 'a4_6_pres' } ]},

            { id: 'a4_6_pres', bg: images.bg.dinner, speaker: 'Thai', text: "Le Poisson Cru au lait de coco de Tahiti. On utilise du thon frais, du concombre et du citron. C'est très frais.", chars: ['Thai'], vocab: [{fr: "Poisson", label: "Le poisson", th: "ปลา"}], dish: 'poisson', next: 'a4_6_choice' },
            { id: 'a4_6_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Poisson (ปลา) cru...)", chars: ['Thai'], dish: 'poisson', choices: [ { text: "C'est mon plat préféré, c'est si léger !", affinity: { Thai: 1 }, next: 'a4_7_pres' }, { text: "Je n'aime pas trop le poisson qui n'est pas cuit.", affinity: { Thai: 0 }, next: 'a4_7_pres' } ]},

            { id: 'a4_7_pres', bg: images.bg.dinner, speaker: 'Nex', text: "Un classique de France métropolitaine : le Magret de Canard rôti avec une sauce au miel et aux figues.", chars: ['Nex'], dish: 'canard', next: 'a4_7_choice' },
            { id: 'a4_7_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Canard sucré-salé ?)", chars: ['Nex'], dish: 'canard', choices: [ { text: "Le mélange sucré-salé est parfait !", affinity: { Nex: 1 }, next: 'a4_8_pres' }, { text: "Je préfère les viandes plus simples.", affinity: { Nex: 0 }, next: 'a4_8_pres' } ]},

            { id: 'a4_8_pres', bg: images.bg.dinner, speaker: 'Phutatchai', text: "Le Tiep Bou Dien, le plat national du Sénégal. C'est du riz rouge cuit avec du poisson, des carottes et du manioc.", chars: ['Phutatchai'], dish: 'tiep', next: 'a4_8_choice' },
            { id: 'a4_8_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Tiep Bou Dien...)", chars: ['Phutatchai'], dish: 'tiep', choices: [ { text: "C'est très complet et coloré, j'adore !", affinity: { Phutatchai: 1 }, next: 'a4_9_pres' }, { text: "Il y a trop de légumes pour moi.", affinity: { Phutatchai: 0 }, next: 'a4_9_pres' } ]},

            { id: 'a4_9_pres', bg: images.bg.dinner, speaker: 'Copper', text: "Directement de Bretagne : la Galette-Saucisse. C'est une crêpe de sarrasin qui entoure une saucisse grillée.", chars: ['Copper'], dish: 'galette', next: 'a4_9_choice' },
            { id: 'a4_9_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Galette saucisse...)", chars: ['Copper'], dish: 'galette', choices: [ { text: "Simple et efficace, j'adore la Bretagne !", affinity: { Copper: 1 }, next: 'a4_10_pres' }, { text: "C'est un peu comme un hot-dog, non ?", affinity: { Copper: 0 }, next: 'a4_10_pres' } ]},

            { id: 'a4_10_pres', bg: images.bg.dinner, speaker: 'Marckris', text: "Pour le dessert, j'ai choisi des Crêpes. Avec du chocolat et des noisettes. Tout le monde aime les crêpes !", chars: ['Marckris'], dish: 'crepes', next: 'a4_10_choice' },
            { id: 'a4_10_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Miam, des crêpes !)", chars: ['Marckris'], dish: 'crepes', choices: [ { text: "Je pourrais en manger dix !", affinity: { Marckris: 1 }, next: 'a4_11_pres' }, { text: "Je préfère les desserts avec des fruits.", affinity: { Marckris: 0 }, next: 'a4_11_pres' } ]},

            { id: 'a4_11_pres', bg: images.bg.dinner, speaker: 'Jung', text: "Le Kouign-Amann. C'est un gâteau breton. En breton, ça veut dire 'gâteau au beurre'. C'est très sucré.", chars: ['Jung'], dish: 'kouign', next: 'a4_11_choice' },
            { id: 'a4_11_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Du beurre et du sucre...)", chars: ['Jung'], dish: 'kouign', choices: [ { text: "C'est un vrai délice croustillant !", affinity: { Jung: 1 }, next: 'a4_12_pres' }, { text: "C'est un peu trop de beurre pour moi.", affinity: { Jung: 0 }, next: 'a4_12_pres' } ]},

            { id: 'a4_12_pres', bg: images.bg.dinner, speaker: 'Peemwasu', text: "Le Gratin de Christophine des Antilles. C'est un légume qui ressemble à une poire, mais c'est salé.", chars: ['Peemwasu'], dish: 'gratin', next: 'a4_12_choice' },
            { id: 'a4_12_choice', bg: images.bg.dinner, speaker: 'Séraphin', text: "(Christophine ?)", chars: ['Peemwasu'], dish: 'gratin', choices: [ { text: "C'est original et très doux.", affinity: { Peemwasu: 1 }, next: 'a5_start' }, { text: "Je préfère les légumes classiques.", affinity: { Peemwasu: 0 }, next: 'a5_start' } ]},

            // --- ACTE 5 ---
            { id: 'a5_start', bg: images.bg.room, speaker: 'Narration', text: "Le dîner est terminé. Nous sommes tous fatigués mais heureux. La suite possède six grands lits doubles (เตียง). C'est le moment de décider de la répartition.", chars: [], next: 'a5_1' },
            { id: 'a5_1', bg: images.bg.room, speaker: 'Jinwook', text: "Bon, les amis, il est minuit. On doit dormir pour être en forme demain.", chars: ['Jinwook'], next: 'a5_2' },
            { id: 'a5_2', bg: images.bg.room, speaker: 'Marckris', text: "C’est vrai, il est tard !", chars: ['Marckris', 'Jinwook'], next: 'a5_3' },
            { id: 'a5_3', bg: images.bg.room, speaker: 'Nex', text: "Les gars, il faut dormir !", chars: ['Nex'], next: 'a5_4' },
            { id: 'a5_4', bg: images.bg.room, speaker: 'Peemwasu', text: "Oui, mais il n’y a que six lits doubles…", chars: ['Peemwasu', 'Jung'], next: 'a5_5' },
            { id: 'a5_5', bg: images.bg.room, speaker: 'Jung', text: "Oh, donc trois personnes vont dormir dans le même lit.", chars: ['Jung', 'AA'], next: 'a5_6' },
            { id: 'a5_6', bg: images.bg.room, speaker: 'AA', text: "Séraphin, puisque tu es notre invité spécial, avec qui veux-tu partager ton lit ?", chars: ['AA'], next: 'a5_choice' },
            { id: 'a5_choice', bg: images.bg.room, speaker: 'Séraphin', text: "Avec qui dormir ?", chars: [], choices: [ { text: "Dormir avec Alan et Marckris", affinity: { Alan: 1, Marckris: 1 }, next: 'a5_end' }, { text: "Dormir avec Khunpol et Heart", affinity: { Khunpol: 1, Heart: 1 }, next: 'a5_end' }, { text: "Dormir avec Jinwook et Thai", affinity: { Jinwook: 1, Thai: 1 }, next: 'a5_end' }, { text: "Dormir avec Nex et Phutatchai", affinity: { Nex: 1, Phutatchai: 1 }, next: 'a5_end' }, { text: "Dormir avec Copper et AA", affinity: { Copper: 1, AA: 1 }, next: 'a5_end' }, { text: "Dormir avec Jung et Peemwasu", affinity: { Jung: 1, Peemwasu: 1 }, next: 'a5_end' } ] },
            { id: 'a5_end', bg: images.bg.room, speaker: 'Narration', text: "Je m'installe dans le lit choisi. On discute encore un peu à voix basse dans le noir. On parle de nos rêves (ความฝัน), de nos peurs... Je sens que je commence à m'attacher à eux. La nuit est douce à Paris.", chars: [], vocab: [{fr: "Rêve", label: "Le rêve", th: "ความฝัน"}], next: 'a6_start' },

            // ACTE 6 (Intégral)
            { id: 'a6_start', bg: images.bg.room, speaker: 'Narration', text: "Le lendemain matin, le réveil (นาฬิกาปลุก) sonne à 7h00. C'est difficile. Il y a de la lumière sous les rideaux. J'entends du bruit dans la chambre. C'est l'effervescence !", chars: [], next: 'a6_1' },
            { id: 'a6_1', bg: images.bg.room, speaker: 'Thai', text: "(En s'étirant les bras) Ouh là là... J'ai mal au dos. Ce lit était trop mou pour moi.", chars: ['Thai'], next: 'a6_2' },
            { id: 'a6_2', bg: images.bg.room, speaker: 'Alan', text: "Allez, debout ! Il est l'heure. On a une longue journée aujourd'hui.", chars: ['Alan', 'Thai'], next: 'a6_3' },
            { id: 'a6_3', bg: images.bg.room, speaker: 'AA', text: "(La tête sous l'oreiller) Encore cinq minutes, s'il vous plaît... Je suis trop fatigué.", chars: ['AA'], next: 'a6_4' },
            { id: 'a6_4', bg: images.bg.room, speaker: 'Thai', text: "(En riant) Ah... Bien dormi les gars ? Moi, j'ai fait un rêve bizarre avec des dauphins bleus.", chars: ['Thai', 'AA'], next: 'a6_5' },
            { id: 'a6_5', bg: images.bg.room, speaker: 'AA', text: "Toi, tu as bien dormi, c'est sûr ! Mais pas nous ! Thai, tu as ronflé comme un moteur de vieux camion toute la nuit ! C'était horrible.", chars: ['AA', 'Peemwasu'], next: 'a6_6' },
            { id: 'a6_6', bg: images.bg.room, speaker: 'Peemwasu', text: "Thai, tu as ronflé comme un moteur de vieux camion toute la nuit ! C'était horrible.", chars: ['Peemwasu', 'Thai'], next: 'a6_7_intro' },
            { id: 'a6_7_intro', bg: images.bg.room, speaker: 'Thai', text: "C'est pas vrai ! Je respire juste un peu fort. C'est tout. Séraphin, dis-leur la vérité. Je suis un dormeur silencieux, n'est-ce pas ?", chars: ['Thai'], next: 'a6_choice_snore' },
            {
                id: 'a6_choice_snore', bg: images.bg.room, speaker: 'Séraphin', text: "...", chars: ['Thai'],
                choices: [
                    { text: "Euh... Désolé Thai, mais c'était vraiment très bruyant !", next: 'a6_snore_noisy' },
                    { text: "Je ne sais pas, j'ai dormi comme un bébé.", next: 'a6_snore_quiet' }
                ]
            },
            { id: 'a6_snore_noisy', bg: images.bg.room, speaker: 'Thai', text: "Oh non... Trahi par mon meilleur allié ! Je suis désolé les gars...", chars: ['Thai'], next: 'a6_8' },
            { id: 'a6_snore_quiet', bg: images.bg.room, speaker: 'Thai', text: "Vous voyez ? Séraphin est gentil, lui.", chars: ['Thai', 'Jung'], next: 'a6_8' },
            
            { id: 'a6_8', bg: images.bg.room, speaker: 'Jung', text: "Bon, assez discuté. Il faut prendre le petit-déjeuner et faire les valises (กระเป๋าเดินทาง). J'ai faim !", chars: ['Jung'], next: 'a6_9' },
            { id: 'a6_9', bg: images.bg.dinner, speaker: 'Narration', text: "Nous sommes dans la cuisine de la suite. Il y a des croissants, du jus d'orange et du café sur la table. Ça sent bon le pain grillé.", chars: [], location: "Paris - Cuisine", next: 'a6_10' },
            { id: 'a6_10', bg: images.bg.dinner, speaker: 'Copper', text: "Passe-moi le beurre, s'il te plaît.", chars: ['Copper', 'Phutatchai'], next: 'a6_11' },
            { id: 'a6_11', bg: images.bg.dinner, speaker: 'Phutatchai', text: "Attention, le café est très chaud !", chars: ['Phutatchai', 'Copper'], next: 'a6_12' },
            { id: 'a6_12', bg: images.bg.dinner, speaker: 'Séraphin', text: "Ce croissant est délicieux. J'adore le petit-déjeuner français.", chars: [], next: 'a6_13' },
            { id: 'a6_13', bg: images.bg.dinner, speaker: 'Nex', text: "Oui, c'est bon, mais il faut se dépêcher. Les taxis arrivent dans une heure.", chars: ['Nex'], next: 'a6_14' },
            { id: 'a6_14', bg: images.bg.room, speaker: 'Narration', text: "C'est la panique dans la chambre. Il y a des vêtements partout sur le sol. Des chaussettes, des t-shirts, des pantalons...", chars: [], location: "Paris - Chambre", next: 'a6_15' },
            { id: 'a6_15', bg: images.bg.room, speaker: 'Heart', text: "Où est ma chaussette rouge ? Je ne trouve pas ma chaussette rouge !", chars: ['Heart', 'Marckris'], next: 'a6_16' },
            { id: 'a6_16', bg: images.bg.room, speaker: 'Marckris', text: "Elle est sous le lit, Heart. Regarde bien.", chars: ['Marckris', 'Heart'], next: 'a6_17' },
            { id: 'a6_17', bg: images.bg.room, speaker: 'Jinwook', text: "Ma valise est trop lourde. Je n'arrive pas à la fermer. Séraphin, tu peux m'aider ?", chars: ['Jinwook'], next: 'a6_18' },
            { id: 'a6_18', bg: images.bg.room, speaker: 'Séraphin', text: "Bien sûr. On va s'asseoir dessus. Un, deux, trois !", chars: ['Jinwook'], next: 'a6_19' },
            { id: 'a6_19', bg: images.bg.hotel, speaker: 'Narration', text: "Enfin, les valises sont fermées. Nous descendons dans le hall de l'hôtel. Les taxis sont là. Il pleut un peu à Paris ce matin.", chars: [], location: "Paris - Hall Hôtel", next: 'a6_20' },
            { id: 'a6_20', bg: images.bg.hotel, speaker: 'Jung', text: "Au revoir Paris ! C'était court, mais c'était bien.", chars: ['Jung', 'Peemwasu'], next: 'a6_21' },
            { id: 'a6_21', bg: images.bg.hotel, speaker: 'Peemwasu', text: "Je suis triste de partir, mais je suis content de voyager.", chars: ['Peemwasu', 'Phutatchai'], next: 'a6_22' },
            { id: 'a6_22', bg: images.bg.hotel, speaker: 'Phutatchai', text: "Séraphin, c'est le moment de la décision. On a trois destinations possibles. Le groupe va se séparer. C'est toi qui choisis notre voyage.", chars: ['Phutatchai'], next: 'route_choice' },

            // Choix Route Finale
            { id: 'route_choice', bg: images.bg.hotel, speaker: 'Choix Crucial', text: "Où partons-nous ?", chars: [], type: 'image', choices: [ { text: "Guadeloupe (Chaleur)", img: images.bg.guadeloupe, next: 'rA_1', route: 'A' }, { text: "St-Pierre (Neige, Calme)", img: images.bg.stpierre, next: 'rB_1', route: 'B' }, { text: "Tahiti (Lagon, Sable)", img: images.bg.tahiti, next: 'rC_1', route: 'C' } ] },

            // === ROUTE A : GUADELOUPE ===
            { id: 'rA_1', bg: images.bg.guadeloupe, speaker: 'Narration', text: "L'avion atterrit à l'aéroport de Pointe-à-Pitre après 8 heures de vol. Les passagers applaudissent. Les portes s'ouvrent et immédiatement, une chaleur humide (ชื้น) et parfumée nous envahit. C'est très différent de Paris.", chars: [], location: "Guadeloupe - Aéroport", vocab: [{fr: "Chaleur humide", label: "La chaleur humide", th: "ชื้น"}], next: 'rA_2' },
            { id: 'rA_2', bg: images.bg.guadeloupe, speaker: 'Marckris', text: "Ah ! Enfin à la maison ! Respirez cet air ! Ça sent les fleurs d'hibiscus (ดอกชบา) et l'océan (มหาสมุทร). Nous sommes en Guadeloupe, l'île papillon !", chars: ['Marckris', 'Jinwook'], vocab: [{fr: "Hibiscus", label: "L'hibiscus", th: "ดอกชบา"}, {fr: "Océan", label: "L'océan", th: "มหาสมุทร"}], next: 'rA_3' },
            { id: 'rA_3', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "Ouah ! Il fait super chaud ici ! C'est comme entrer dans un sauna tout habillé. Je transpire déjà.", chars: ['Jinwook', 'Khunpol'], next: 'rA_4' },
            { id: 'rA_4', bg: images.bg.guadeloupe, speaker: 'Khunpol', text: "Vite, je dois enlever mon manteau. C'est l'été ici ! Pourquoi j'ai mis un pull en laine ?", chars: ['Khunpol', 'Nex'], next: 'rA_5' },
            { id: 'rA_5', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Regardez le ciel. Il est d'un bleu incroyable, presque turquoise (สีฟ้าอมเขียว). Il n'y a pas un seul nuage. Les bagages sont déchargés par le personnel au sol. J'espère qu'ils ne vont pas casser ma guitare.", chars: ['Nex'], vocab: [{fr: "Turquoise", label: "Turquoise", th: "สีฟ้าอมเขียว"}], next: 'rA_6' },
            { id: 'rA_6', bg: images.bg.guadeloupe, speaker: 'Séraphin', text: "C'est magnifique ! Les couleurs sont très vives, c'est éblouissant. J'ai l'impression d'être dans un tableau.", chars: [], next: 'rA_7' },
            { id: 'rA_7', bg: images.bg.guadeloupe, speaker: 'Khunpol', text: "Séraphin, ça va ? Tu n'as pas trop chaud ? Ton visage est tout rouge. Nous sommes venus ici pour profiter du soleil (ดวงอาทิตย์), mais il faut être prudent avec les coups de chaleur.", chars: ['Khunpol'], vocab: [{fr: "Soleil", label: "Le soleil", th: "ดวงอาทิตย์"}], next: 'rA_choice_1' },
            { id: 'rA_choice_1', bg: images.bg.guadeloupe, speaker: 'Séraphin', text: "...", chars: ['Khunpol', 'Nex', 'Marckris'], choices: [ { text: "Si, un peu. J'ai besoin d'une bouteille d'eau fraîche.", affinity: { Nex: 1 }, next: 'rA_8' }, { text: "Non, j'adore la chaleur (ความร้อน) ! Ça me donne de l'énergie !", affinity: { Marckris: 1 }, next: 'rA_8' } ] },
            { id: 'rA_8', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Tiens, bois un peu. Il faut s'hydrater (ดื่มน้ำ).", chars: ['Nex'], vocab: [{fr: "Chaleur", label: "La chaleur", th: "ความร้อน"}], next: 'rA_9' },
            { id: 'rA_9', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "Merci Nex. Bon, on y va ?", chars: ['Jinwook'], next: 'rA_bus' },

            { id: 'rA_bus', bg: images.bg.guadeloupe, speaker: 'Narration', text: "Nous montons dans un bus coloré pour aller à l'hôtel.", chars: [], location: "Guadeloupe - Bus", next: 'rA_bus_1' },
            { id: 'rA_bus_1', bg: images.bg.guadeloupe, speaker: 'Marckris', text: "Écoutez ce rythme ! C'est du Zouk. Ça donne envie de danser ! Allez, bougez avec moi !", chars: ['Marckris'], next: 'rA_bus_2' },
            { id: 'rA_bus_2', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Marckris, calme-toi un peu... Les autres passagers nous regardent. Tu es trop bruyant.", chars: ['Nex', 'Jinwook'], next: 'rA_bus_3' },
            { id: 'rA_bus_3', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "Moi j'aime bien ! C'est joyeux. Séraphin, tu aimes cette musique ?", chars: ['Jinwook'], next: 'rA_bus_choice' },
            { id: 'rA_bus_choice', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "Alors ?", chars: ['Jinwook'], choices: [ { text: "J'adore ! Je danse sur mon siège !", affinity: { Marckris: 1 }, next: 'rA_bus_4' }, { text: "C'est sympa, mais je préfère regarder le paysage tranquillement.", affinity: { Nex: 1 }, next: 'rA_bus_4' }, { text: "Quelle énergie ! Ça me réveille !", affinity: { Jinwook: 1 }, next: 'rA_bus_4' } ] },
            { id: 'rA_bus_4', bg: images.bg.guadeloupe, speaker: 'Marckris', text: "Ah, vous voyez ! Mais regardez par la fenêtre maintenant !", chars: ['Marckris', 'Khunpol'], next: 'rA_bus_5' },
            { id: 'rA_bus_5', bg: images.bg.guadeloupe, speaker: 'Khunpol', text: "Ce sont des champs verts immenses... C'est de l'herbe géante ?", chars: ['Khunpol'], next: 'rA_bus_6' },
            { id: 'rA_bus_6', bg: images.bg.guadeloupe, speaker: 'Marckris', text: "Non, c'est de la canne à sucre (อ้อย). C'est avec ça qu'on fait le sucre et le rhum. C'est très important pour l'économie de l'île.", chars: ['Marckris', 'Nex'], vocab: [{fr: "Canne à sucre", label: "La canne à sucre", th: "อ้อย"}], next: 'rA_bus_7' },
            { id: 'rA_bus_7', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Et il y a aussi beaucoup de bananiers. La banane (กล้วย) est 'l'or vert' de la Guadeloupe.", chars: ['Nex'], vocab: [{fr: "Banane", label: "La banane", th: "กล้วย"}], next: 'rA_bus_8' },
            { id: 'rA_bus_8', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "Moi, je préfère manger les bananes que les regarder. J'ai faim !", chars: ['Jinwook'], next: 'rA_bus_9' },
            { id: 'rA_bus_9', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Allons manger alors !", chars: ['Nex'], next: 'rA_market' },

            { id: 'rA_market', bg: images.bg.guadeloupe, speaker: 'Narration', text: "Le lendemain matin, marché de Basse-Terre. C'est un endroit animé. Il y a beaucoup de monde. Ça crie, ça rit, ça discute. Les étals sont remplis de couleurs.", chars: [], location: "Guadeloupe - Marché", next: 'rA_market_1' },
            { id: 'rA_market_1', bg: images.bg.guadeloupe, speaker: 'Vendeuse', text: "Allez, goûtez mes fruits ! Mangues (มะม่วง), ananas (สับปะรด), fruits de la passion (เสาวรส), caramboles (มะเฟือง) !", chars: [], vocab: [{fr: "Mangue", label: "La mangue", th: "มะม่วง"}, {fr: "Ananas", label: "L'ananas", th: "สับปะรด"}, {fr: "Fruit de la passion", label: "Le fruit de la passion", th: "เสาวรส"}, {fr: "Carambole", label: "La carambole", th: "มะเฟือง"}], next: 'rA_market_2' },
            { id: 'rA_market_2', bg: images.bg.guadeloupe, speaker: 'Khunpol', text: "Ça sent fort les épices (เครื่องเทศ) ici. C'est quoi cette odeur (กลิ่น) chaude ? C'est de la cannelle (อบเชย) ?", chars: ['Khunpol'], vocab: [{fr: "Epices", label: "Les épices", th: "เครื่องเทศ"}, {fr: "Odeur", label: "L'odeur", th: "กลิ่น"}, {fr: "Cannelle", label: "La cannelle", th: "อบเชย"}], next: 'rA_market_3' },
            { id: 'rA_market_3', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Oui, c'est de la cannelle, et je sens aussi de la vanille. Mais regardez ça, c'est de la poudre de Colombo. C'est un mélange d'épices très célèbre ici, comme le curry, pour cuisiner le poulet.", chars: ['Nex', 'Jinwook'], next: 'rA_market_4' },
            { id: 'rA_market_4', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "Regardez ces chapeaux en feuilles de palmier (ต้นปาล์ม) ! J'en veux un. Séraphin, lequel je choisis ?", chars: ['Jinwook'], vocab: [{fr: "Palmier", label: "Le palmier", th: "ต้นปาล์ม"}], next: 'rA_hat_choice' },
            { id: 'rA_hat_choice', bg: images.bg.guadeloupe, speaker: 'Séraphin', text: "...", chars: ['Jinwook'], choices: [ { text: "Le jaune très coloré avec le ruban rouge !", affinity: { Jinwook: 1 }, next: 'rA_market_5' }, { text: "Le chapeau en paille simple, plus élégant.", affinity: { Nex: 1 }, next: 'rA_market_5' }, { text: "Tu n'as pas besoin de chapeau, tes cheveux te protègent !", affinity: { Khunpol: 1 }, next: 'rA_market_5' } ] },
            { id: 'rA_market_5', bg: images.bg.guadeloupe, speaker: 'Khunpol', text: "Moi je vais acheter du piment (พริก) antillais !", chars: ['Khunpol'], vocab: [{fr: "Piment", label: "Le piment", th: "พริก"}], next: 'rA_market_6' },
            { id: 'rA_market_6', bg: images.bg.guadeloupe, speaker: 'Marckris', text: "Attention Khunpol ! Ce piment est volcanique (เกี่ยวกับภูเขาไฟ).", chars: ['Marckris'], vocab: [{fr: "Volcanique", label: "Volcanique", th: "เกี่ยวกับภูเขาไฟ"}], next: 'rA_market_7' },
            { id: 'rA_market_7', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Allez, on achète des fruits pour le pique-nique et on y va. La randonnée nous attend.", chars: ['Nex'], next: 'rA_hike' },

            { id: 'rA_hike', bg: images.bg.guadeloupe, speaker: 'Narration', text: "Au pied du volcan de la Soufrière. Forêt (ป่า) tropicale humide.", chars: [], location: "Guadeloupe - Volcan", vocab: [{fr: "Forêt", label: "La forêt", th: "ป่า"}, {fr: "Fougère", label: "La fougère", th: "เฟิร์น"}], next: 'rA_hike_1' },
            { id: 'rA_hike_1', bg: images.bg.guadeloupe, speaker: 'Marckris', text: "Allez, c'est parti ! On va voir le cratère ! Nous marchons vite.", chars: ['Marckris'], next: 'rA_hike_2' },
            { id: 'rA_hike_2', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "Attendez-moi ! J'ai une pierre dans ma chaussure... Et ça monte beaucoup !", chars: ['Jinwook', 'Khunpol'], next: 'rA_hike_3' },
            { id: 'rA_hike_3', bg: images.bg.guadeloupe, speaker: 'Khunpol', text: "Allez courage... Oh ! Une grosse araignée (แมงมุม) noire ! Ne bougez pas !", chars: ['Khunpol', 'Nex'], vocab: [{fr: "Araignée", label: "L'araignée", th: "แมงมุม"}], next: 'rA_hike_4' },
            { id: 'rA_hike_4', bg: images.bg.guadeloupe, speaker: 'Nex', text: "Elle est belle. C'est une matoutou falaise (แมงมุมทารันทูล่าท้องถิ่น). Elle est inoffensive (ไม่เป็นอันตราย), elle tisse sa toile.", chars: ['Nex'], vocab: [{fr: "Matoutou Falaise", label: "La matoutou falaise", th: "แมงมุมทารันทูล่าท้องถิ่น"}, {fr: "Inoffensif", label: "Inoffensif", th: "ไม่เป็นอันตราย"}], next: 'rA_spider_choice' },
            { id: 'rA_spider_choice', bg: images.bg.guadeloupe, speaker: 'Séraphin', text: "...", chars: ['Khunpol', 'Nex'], choices: [ { text: "Aaaah ! Enlève-la, Khunpol ! J'ai peur des araignées !", affinity: { Khunpol: 1 }, next: 'rA_hike_5' }, { text: "Elle est fascinante, tu as raison Nex. Regardons-la de plus près.", affinity: { Nex: 1 }, next: 'rA_hike_5' }, { text: "On s'en fiche de l'araignée, continuons la marche ! On va être en retard !", affinity: { Marckris: 1 }, next: 'rA_hike_5' } ] },
            { id: 'rA_hike_5', bg: images.bg.guadeloupe, speaker: 'Jinwook', text: "J'ai soif... et j'ai faim. On fait une pause ?", chars: ['Jinwook'], next: 'rA_hike_6' },

        // --- MOTEUR ---
        function renderScene() {
            if (state.currentId === 'final_reveal') {
                showEnding();
                return;
            }

            const scene = script.find(s => s.id === state.currentId);
            if(!scene) return;

            const getText = (txt) => txt.replace(/Séraphin/g, state.playerName);

            // GESTION DU LIEU ET VOCABULAIRE
            if (scene.location) state.currentLocation = scene.location;
            
            const vocabList = document.getElementById('vocab-list');
            
            if (scene.vocab) {
                let added = false;
                scene.vocab.forEach(word => {
                    if (!state.vocabHistory.some(v => v.fr === word.fr)) {
                        state.vocabHistory.push(word);
                        added = true;
                        
                        // Ajout DOM direct pour éviter de tout redessiner
                        const li = document.createElement('li');
                        li.className = 'vocab-item new'; // Classe pour animation
                        const displayWord = word.label || word.fr;
                        li.innerHTML = `<span class="vocab-word">${displayWord}</span> <span class="vocab-thai">${word.th}</span>`;
                        vocabList.appendChild(li);
                    }
                });

                // Garder les 6 derniers
                if (state.vocabHistory.length > 6) {
                    state.vocabHistory = state.vocabHistory.slice(-6);
                    // Nettoyer le DOM pour correspondre (enlever les premiers enfants)
                    while (vocabList.children.length > 6) {
                        vocabList.removeChild(vocabList.firstChild);
                    }
                }
            }
            
            // Si la liste est vide au chargement initial
            if (vocabList.children.length === 0 && state.vocabHistory.length > 0) {
                 state.vocabHistory.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'vocab-item';
                    const displayWord = item.label || item.fr;
                    li.innerHTML = `<span class="vocab-word">${displayWord}</span> <span class="vocab-thai">${item.th}</span>`;
                    vocabList.appendChild(li);
                });
            }

            document.getElementById('location-display').innerText = "📍 " + state.currentLocation;

            // Sécurité : S'assurer que le mémo est toujours visible, même après un retour en arrière depuis la fin
            document.getElementById('location-display').style.display = 'block';
            document.getElementById('vocab-display').style.display = 'flex';

            // GESTION FOND (Optimisée)
            const bgLayer = document.getElementById('bg');
            const newBg = `url('${scene.bg}')`;
            if (bgLayer.style.backgroundImage.replace(/["']/g, "") !== newBg.replace(/["']/g, "")) {
                bgLayer.style.backgroundImage = newBg;
            }

            // GESTION PERSONNAGES & PLATS (Optimisée)
            const charContainer = document.getElementById('chars');
            const speakerName = getText(scene.speaker);
            const existingNodes = Array.from(charContainer.children);
            const neededChars = scene.chars || [];
            const neededDish = scene.dish || null; 

            // Nettoyage intelligent
            existingNodes.forEach(node => {
                const name = node.dataset.name;
                const type = node.dataset.type; 

                if (type === 'char') {
                    if (neededChars.includes(name)) {
                        node.className = `char-sprite active ${name === speakerName ? 'speaking' : ''}`;
                    } else {
                        node.classList.remove('active', 'speaking');
                        setTimeout(() => { if (!node.classList.contains('active') && node.parentNode) node.remove(); }, 400);
                    }
                } else if (type === 'dish') {
                    if (name === neededDish) {
                        node.className = 'dish-sprite active';
                    } else {
                        node.classList.remove('active');
                        setTimeout(() => { if (!node.classList.contains('active') && node.parentNode) node.remove(); }, 400);
                    }
                }
            });

            // Ajout
            neededChars.forEach(name => {
                const exists = existingNodes.find(node => node.dataset.name === name && node.dataset.type === 'char');
                if (!exists && images.chars[name]) {
                    const img = document.createElement('img');
                    img.src = images.chars[name];
                    img.dataset.name = name;
                    img.dataset.type = 'char';
                    img.className = `char-sprite ${name === speakerName ? 'speaking' : ''}`;
                    charContainer.appendChild(img);
                    void img.offsetWidth; 
                    img.classList.add('active');
                }
            });
            if (neededDish) {
                const exists = existingNodes.find(node => node.dataset.name === neededDish && node.dataset.type === 'dish');
                if (!exists && images.dishes[neededDish]) {
                    const img = document.createElement('img');
                    img.src = images.dishes[neededDish];
                    img.dataset.name = neededDish;
                    img.dataset.type = 'dish';
                    img.className = 'dish-sprite';
                    charContainer.appendChild(img);
                    void img.offsetWidth;
                    img.classList.add('active');
                }
            }

            // UI
            document.getElementById('dialogue-panel').style.display = 'flex';
            document.getElementById('choice-screen').style.display = 'none';
            
            const nameTag = document.getElementById('name-tag');
            const displayName = getText(scene.speaker);
            nameTag.innerText = displayName;
            nameTag.classList.remove('right-aligned');
            if (displayName === state.playerName) {
                nameTag.style.background = 'linear-gradient(135deg, var(--hero-color-start), var(--hero-color-end))';
                nameTag.classList.add('right-aligned');
            } else if (scene.speaker === 'Narration') {
                nameTag.style.background = '#2d3436';
            } else {
                nameTag.style.background = 'linear-gradient(135deg, var(--primary), var(--accent))';
            }

            const dialogueText = document.getElementById('dialogue-text');
            dialogueText.classList.remove('animate-text');
            void dialogueText.offsetWidth; 
            dialogueText.classList.add('animate-text');
            
            let formattedText = getText(scene.text);
            formattedText = formattedText.replace(/(\([\u0E00-\u0E7F]+\))/g, '<span class="thai-word">$1</span>');
            
            if (scene.vocab) {
                scene.vocab.forEach(v => {
                    const regex = new RegExp(`(${v.fr}[sx]?)`, 'gi');
                    formattedText = formattedText.replace(regex, '<span class="highlight-word">$1</span>');
                });
            }
            dialogueText.innerHTML = formattedText;

            // Gestion Choix
            const dialPanel = document.getElementById('dialogue-panel');
            if (scene.choices || scene.type === 'input') {
                dialPanel.onclick = null; 
                document.querySelector('.next-btn').style.display = 'none';
                
                const choiceScreen = document.getElementById('choice-screen');
                choiceScreen.innerHTML = '';
                choiceScreen.style.display = 'flex';

                if (scene.type === 'input') {
                    const input = document.createElement('input');
                    input.type = 'text'; input.className = 'name-input'; input.placeholder = "Entrez votre prénom";
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn'; btn.innerText = "Valider";
                    btn.onclick = () => { if(input.value.trim()) { state.playerName = input.value.trim(); nextStep(); } };
                    choiceScreen.appendChild(input); choiceScreen.appendChild(btn); input.focus();
                } else if (scene.type === 'image') {
                    const container = document.createElement('div'); container.className = 'cards-container';
                    scene.choices.forEach(c => {
                        const card = document.createElement('div'); card.className = 'img-card';
                        card.innerHTML = `<img src="${c.img}"><div>${getText(c.text)}</div>`;
                        card.onclick = () => makeChoice(c); container.appendChild(card);
                    });
                    choiceScreen.appendChild(container);
                } else {
                    scene.choices.forEach(c => {
                        const btn = document.createElement('button'); btn.className = 'choice-btn';
                        btn.innerText = getText(c.text); btn.onclick = () => makeChoice(c);
                        choiceScreen.appendChild(btn);
                    });
                }
            } else {
                dialPanel.onclick = nextStep;
                document.querySelector('.next-btn').style.display = 'flex';
            }
        }

        function saveState() {
            const stateClone = { currentId: state.currentId, affinity: { ...state.affinity }, route: state.route, playerName: state.playerName, currentLocation: state.currentLocation, vocabHistory: [...state.vocabHistory] };
            historyStack.push(stateClone);
            updateControls();
        }
        function goBack() {
            if (historyStack.length === 0) return;
            state = historyStack.pop();
            updateControls();
            renderScene();
        }
        function updateControls() {
            const btn = document.getElementById('back-btn');
            btn.style.display = (historyStack.length > 0) ? 'flex' : 'none';
        }
        function nextStep() {
            const scene = script.find(s => s.id === state.currentId);
            if (scene && scene.next) { saveState(); state.currentId = scene.next; renderScene(); }
        }

        function makeChoice(choice) {
            saveState(); 
            if (choice.affinity) {
                for (let char in choice.affinity) {
                    if (state.affinity[char] !== undefined) state.affinity[char] += choice.affinity[char];
                }
            }
            if (choice.route) state.route = choice.route;
            
            // LOGIQUE DE FIN
            if (choice.next.startsWith('end_') && choice.next !== 'end_single') {
                let candidates = [];
                if (state.route === 'A') candidates = ['Marckris', 'Nex', 'Khunpol', 'Jinwook'];
                else if (state.route === 'B') candidates = ['Jung', 'Peemwasu', 'Heart', 'AA'];
                else if (state.route === 'C') candidates = ['Thai', 'Copper', 'Phutatchai', 'Alan'];
                else candidates = Object.keys(state.affinity);

                let winner = candidates.reduce((best, current) => 
                    (state.affinity[current] > state.affinity[best]) ? current : best
                , candidates[0]);
                
                let prefix = "";
                if (state.route === 'A') prefix = "end_A_";
                else if (state.route === 'B') prefix = "end_B_";
                else if (state.route === 'C') prefix = "end_C_";
                
                let targetId = prefix + winner.toLowerCase();
                
                if (script.find(s => s.id === targetId)) {
                    state.currentId = targetId;
                } else {
                    state.currentId = choice.next;
                }
            } else {
                state.currentId = choice.next;
            }
            
            renderScene();
        }

        function showEnding() {
            let candidates = Object.keys(state.affinity);
            let winner = candidates.reduce((best, current) => 
                (state.affinity[current] > state.affinity[best]) ? current : best
            , candidates[0]);

            let isSingle = (state.currentId === 'end_single' || state.currentId === 'end_single_2');
            let finalText = "";
            
            const endings = {
                Marckris: "Vous restez en Guadeloupe pour cultiver des fruits exotiques et ouvrir un bar à jus sur la plage.",
                Nex: "Vous partez faire un tour du monde pour découvrir d'autres volcans et jouer de la musique.",
                Khunpol: "Vous ouvrez un gîte de montagne écologique pour les randonneurs.",
                Jinwook: "Vous devenez animateurs sportifs et organisez des marathons sur la plage.",
                Jung: "Vous restez dans le chalet isolé pour écrire des livres et des poèmes ensemble.",
                Peemwasu: "Vous créez une marque de cosmétiques naturels à base de plantes nordiques.",
                Heart: "Vous ouvrez une boulangerie traditionnelle française sur l'île.",
                AA: "Vous devenez photographes de l'extrême et voyagez dans les pays froids.",
                Thai: "Vous achetez un voilier et voyagez d'île en île en vivant de la pêche.",
                Copper: "Vous devenez danseurs professionnels et ouvrez une école de danse sur la plage.",
                Phutatchai: "Vous travaillez pour une association qui protège les tortues marines et l'environnement.",
                Alan: "Vous écrivez un livre de recettes polynésiennes."
            };

            if (isSingle) {
                finalText = `${state.playerName} rentre seul en France. FIN. จบ บายๆ Au revoir BUS !`;
            } else {
                finalText = `Félicitations ! ${state.playerName} se marie avec ${winner}.\n${endings[winner]}`;
            }

            document.getElementById('choice-screen').style.display = 'none';
            document.getElementById('chars').innerHTML = '';
            
            if (!isSingle) {
                const winnerImg = document.createElement('img');
                winnerImg.src = images.chars[winner];
                winnerImg.className = 'char-sprite active speaking';
                document.getElementById('chars').appendChild(winnerImg);
            } else {
                const heroImg = document.createElement('img');
                heroImg.src = images.chars['Seraphin'];
                heroImg.className = 'char-sprite active speaking';
                document.getElementById('chars').appendChild(heroImg);
            }

            document.getElementById('dialogue-panel').style.display = 'flex';
            document.getElementById('dialogue-panel').onclick = null;
            document.querySelector('.next-btn').style.display = 'none';
            document.getElementById('location-display').style.display = 'none'; 
            document.getElementById('vocab-display').style.display = 'none';

            document.getElementById('name-tag').innerText = "FIN DU VOYAGE";
            document.getElementById('name-tag').style.background = "gold";
            document.getElementById('name-tag').style.color = "black";

            document.getElementById('dialogue-text').innerText = finalText;
            document.getElementById('back-btn').style.display = 'none';
        }

        window.onload = renderScene;
    </script>
</body>
</html>
